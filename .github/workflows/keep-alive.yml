# Pings Vercel and Render on a schedule so free-tier services don't spin
# down or pause from inactivity.
#
# Optional repo variables (Settings → Secrets and variables → Actions → Variables):
#   VERCEL_APP_URL        default: https://memory404.vercel.app
#   RENDER_API_URL        your Render service URL (skip/soft-fail if unset or 404)

name: Keep services alive

on:
  schedule:
    # Render free tier sleeps after ~15 minutes without traffic
    - cron: "*/14 * * * *"
  workflow_dispatch:

concurrency:
  group: keep-alive
  cancel-in-progress: false

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      VERCEL_APP_URL: ${{ vars.VERCEL_APP_URL }}
      RENDER_API_URL: ${{ vars.RENDER_API_URL }}
    steps:
      - name: Ping Vercel (frontend + MongoDB health)
        run: |
          URL="${VERCEL_APP_URL:-https://memory404.vercel.app}"
          echo "Pinging ${URL}/api/health"
          curl -fsS --retry 2 --retry-delay 5 --max-time 45 \
            "${URL}/api/health"
          echo
          echo "Vercel OK"

      - name: Ping Render (backend + MongoDB health)
        run: |
          URL="${RENDER_API_URL:-https://memory404-api.onrender.com}"
          echo "Pinging ${URL}/health"
          # Soft-fail: Render may not be deployed yet; Vercel health already hits the DB.
          code=$(curl -sS -o /tmp/render-health.json -w "%{http_code}" \
            --retry 2 --retry-delay 10 --max-time 120 \
            "${URL}/health" || true)
          echo "HTTP ${code}"
          if [ "$code" = "200" ]; then
            cat /tmp/render-health.json || true
            echo
            echo "Render OK"
          else
            echo "::warning::Render health returned ${code} (service may not be deployed). Continuing."
          fi
