name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run test:coverage
      - run: npm run build
        env:
          SESSION_SECRET: ci-only-session-secret
      - run: npm ci --prefix extension
      - run: npx webpack --config webpack.prod.js
        working-directory: extension
      - run: node --check extension/public/static/background.js
      - run: node --check extension/dist/overlay.js
      - run: npx playwright install --with-deps chromium
      - run: xvfb-run -a node scripts/smoke-extension.mjs
      - run: xvfb-run -a node scripts/smoke-extension-note.mjs
      - run: npm run test:e2e
        env:
          CI: true
          SESSION_SECRET: ci-only-session-secret
